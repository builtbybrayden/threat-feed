name: ci

# Gate every pull request (and pushes to main) on the test suite. This job is
# deliberately offline: it installs pinned deps, runs pytest, and runs the local
# validation example. No feed ingestion, no network enrichment, no external
# scanning — just a self-check that the code and the shipped fixtures are sound.
on:
  pull_request: {}
  push:
    branches: [main]

# Least privilege: this job only needs to read the checkout.
# (No pull_request_target anywhere — CLAUDE.md security requirement.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # The validation example is stdlib-only and fully local (it binds a toy
      # server on loopback). It must report all three controls as expected:
      # the vulnerable instance detects, the patched and benign controls do not.
      - name: Local detection validation (3 controls)
        run: python validation/example_path_traversal/run_validation.py
