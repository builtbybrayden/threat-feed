name: pipeline

# Ingest -> enrich -> triage -> publish to Pages, every 6 hours.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Least privilege by default; each job opts into exactly what it needs.
# (No pull_request_target anywhere — CLAUDE.md security requirement.)
permissions: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit refreshed state.json + site data + briefs
      issues: write     # open/close nuclei-candidate issues
    steps:
      # Third-party actions are pinned to full commit SHAs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Nuclei coverage index
        run: |
          git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git nuclei-templates
          python -m pipeline.coverage --templates ./nuclei-templates --out cache/coverage_index.json

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional; raises the NVD rate limit when configured as a secret.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python -m pipeline.ingest --limit-nvd 60

      - name: Commit refreshed data
        run: |
          git config user.name "threat-feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json site/data.json site/candidates.json briefs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh feed data [skip ci]"
          # A concurrent push (a manual commit, an overlapping run) may have landed
          # while we were building; rebase onto it so the push can't be rejected.
          git pull --rebase --autostash origin main
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Deploy the data the update job just committed, not the commit that
          # triggered the run (otherwise the live site lags a full run behind).
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
