# ---------------------------------------------------------------------------
# Threat-feed pipeline configuration.
#
# All tunable behaviour lives here, not as magic numbers in code (CLAUDE.md).
# Every feed URL below was verified to resolve on 2026-10-27.
# ---------------------------------------------------------------------------

feeds:
  - name: PortSwigger Research
    url: https://portswigger.net/research/rss
    type: research
  - name: Project Zero
    url: https://projectzero.google/feed.xml      # old blogspot URL 302s here
    type: research
  - name: GitHub Security Lab
    url: https://securitylab.github.com/advisories/feed.xml
    type: research
  - name: tl;dr sec
    url: https://tldrsec.com/feed.xml              # 301s to a beehiiv feed; followed
    type: news
  - name: Risky Bulletin
    url: https://risky.biz/feeds/risky-business-news/
    type: news
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    type: news

kev:
  # CISA Known Exploited Vulnerabilities catalog (JSON).
  url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

epss:
  # FIRST EPSS API. We batch CVE ids to stay polite.
  url: https://api.first.org/data/v1/epss
  batch_size: 100

nvd:
  url: https://services.nvd.nist.gov/rest/json/cves/2.0
  # NVD rate limits aggressively. With an API key (NVD_API_KEY env var) the
  # limit is ~50 req / 30s; without, ~5 req / 30s. We throttle accordingly.
  delay_no_key: 6.5
  delay_with_key: 0.8
  # Don't re-fetch a CVE's static NVD data more often than this (seconds).
  cache_ttl: 604800        # 7 days

poc:
  # nomi-sec PoC-in-GitHub: per-year JSON files mapping CVE -> PoC repos.
  base_url: https://raw.githubusercontent.com/nomi-sec/PoC-in-GitHub/master

coverage:
  repo: https://github.com/projectdiscovery/nuclei-templates.git
  # Built index is cached here so we don't re-clone every run.
  index_cache: cache/coverage_index.json

advisories:
  # GitHub Advisory Database: recent reviewed advisories per package ecosystem,
  # plus a cross-ecosystem critical pull. This is what gives the Threats board
  # real per-ecosystem coverage (PyPI/npm/Maven/Go/...) instead of only KEV +
  # whatever the newsletters happened to name. Public API; GITHUB_TOKEN (already
  # present in CI) raises the rate limit to 5000/hr and is used automatically.
  enabled: true
  api_url: https://api.github.com/advisories
  severities: [critical, high]   # one query per (ecosystem, severity)
  lookback_days: 45              # only advisories published within this window
  per_ecosystem_cap: 60          # cap pulled per (ecosystem, severity)
  general_cap: 120               # cap for the cross-ecosystem critical pull
  # GitHub ecosystem names (pip = PyPI; maven covers Java + Gradle).
  ecosystems: [pip, npm, maven, go, rubygems, nuget, composer, rust, actions, swift]

http:
  timeout: 20
  retries: 3
  backoff_factor: 1.5
  user_agent: threat-feed-aggregator/0.1 (+https://github.com/builtbybrayden)

# --- Scoring -------------------------------------------------------------
# score = source_weight
#       + kev_bonus            (if in KEV)
#       + epss * epss_weight
#       + watchlist_bonus      (once, if any watchlist term hits)
#       + poc_bonus            (if a PoC is known)
#       + recency_max * 0.5 ** (age_days / half_life_days)
# then clamped to `clamp`. Each term that fires is recorded in score_reasons[].
scoring:
  source_weights:
    PortSwigger Research: 15
    Project Zero: 15
    GitHub Security Lab: 12
    tl;dr sec: 8
    Risky Bulletin: 8
    Simon Willison: 6
    CISA KEV: 20
  default_source_weight: 5
  kev_bonus: 40
  epss_weight: 30
  watchlist_bonus: 15
  poc_bonus: 10
  appsec_bonus: 14      # push application-security-relevant items up the feed
  recency:
    max_bonus: 15
    half_life_days: 7
  clamp: [0, 100]

# --- Feed split (News vs Threats) ---------------------------------------
# Threats = an item that names a CVE AND carries a priority signal (KEV, high
# EPSS, a public PoC, or an AppSec product). Multi-CVE newsletter roundups are
# kept in News even when they mention CVEs, so "reading" stays separate from
# "new/active vulnerabilities".
feed:
  epss_threshold: 0.3
  roundup_min_cves: 3   # >= this many CVEs in one item => treat as a News roundup

# --- Headline stats (AppSec-focused) ------------------------------------
stats:
  # "Newly exploited" counts AppSec CVEs added to CISA KEV within this window
  # (KEV's dateAdded is a reliable real-world "just started being exploited"
  # signal, unlike our own first-seen time).
  new_exploited_days: 30
  threats_limit: 60         # (legacy) retained for compatibility

# --- Threats board composition ------------------------------------------
# The board leads with the highest-priority AppSec vulns globally, but also
# guarantees each ecosystem contributes its top N so the per-ecosystem quick
# filters always have data (otherwise a KEV-heavy global top would crowd the
# package ecosystems out entirely).
threats_board:
  general_top: 60       # highest-scoring AppSec vulns, any ecosystem
  per_ecosystem: 15     # also include each ecosystem's top N
  max_total: 200        # hard cap on the published board

# --- Detection triage ----------------------------------------------------
candidate:
  # A CVE is a candidate if it has no template AND is remote/HTTP-detectable
  # AND (in KEV OR epss >= this OR a watchlist term hits).
  epss_threshold: 0.3

queue:
  # The detection queue is user-curated: it is built from open GitHub issues
  # carrying this label. "Add to detection queue" in the UI opens a prefilled
  # issue with it, and the pipeline lists those into site/queue.json. Nothing is
  # auto-added anymore.
  label: detection-queue

# CWE ids that imply a web/HTTP-detectable issue (used by triage).
web_cwes: [22, 78, 79, 89, 94, 287, 352, 434, 502, 611, 862, 918]
