# Application-security watchlist. Matching is case-insensitive and
# word-boundary aware (so "mcp" won't match "mcpherson"), against each item's
# title + summary and each CVE's vendor/product/description.
#
# This repo is AppSec-focused: the emphasis is package ecosystems, web
# frameworks, languages, and the vulnerability classes a DAST/web pentester
# cares about. Generic network/OS gear is intentionally lighter here so
# application-layer issues rise to the top (we re-rank, we don't drop).
terms:
  # --- package ecosystems / dependency supply chain ---
  - npm
  - node.js
  - yarn
  - pnpm
  - pypi
  - pip
  - maven
  - gradle
  - rubygems
